name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install @capacitor/android@7.4.3

      - name: Generate Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Francais-au-lycee-Maroc-V8.apk

      - name: Archive Android project
        run: |
          zip -r release/Francais-au-lycee-Maroc-V8-Android-Project.zip android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Francais-au-lycee-Maroc-V8-APK
          path: release/Francais-au-lycee-Maroc-V8.apk

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: Francais-au-lycee-Maroc-V8-Android-Project
          path: release/Francais-au-lycee-Maroc-V8-Android-Project.zip
